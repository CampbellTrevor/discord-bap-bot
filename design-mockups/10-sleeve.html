<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>10 — Sleeve</title>
<style>
:root{color-scheme:dark;--bg:#101112;--fg:#ececeb;--muted:#949795;--line:#303233}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px Arial,Helvetica,sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #b6c4ef;outline-offset:4px}header{height:76px;border-bottom:1px solid var(--line);margin:0 40px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:23px;letter-spacing:-1px;font-weight:700}.brand b{font-size:13px;margin-left:8px;font-weight:400;color:var(--muted)}.account{display:flex;gap:28px;align-items:center;font-size:12px}.account select{border:0;background:transparent;color:var(--fg);padding:7px}.account select option{background:var(--bg)}.avatar{border:1px solid #5b5d5e;border-radius:50%;width:28px;height:28px;display:inline-grid;place-items:center;margin-right:8px;font-size:10px}main{display:grid;grid-template-columns:1fr 1fr;gap:60px;margin:30px 40px}.eyebrow{font-size:10px;letter-spacing:1.8px;color:var(--muted);text-transform:uppercase;margin:0 0 18px}.album{height:340px;max-width:540px;background:#292e3a;position:relative;overflow:hidden}.album:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 42px,#ffffff09 42px 43px),repeating-linear-gradient(90deg,transparent 0 60px,#ffffff09 60px 61px)}.album-title{font:700 125px/1 Arial;letter-spacing:-12px;position:absolute;top:33px;left:28px;color:#dee1ea;z-index:2}.album-label{position:absolute;left:36px;top:169px;font-size:11px;letter-spacing:5px;color:#c2c8d8}.city{position:absolute;bottom:0;background:#1b1e27;width:12%;height:22%}.city:nth-of-type(4){left:14%;height:31%}.city:nth-of-type(5){left:30%;height:44%}.city:nth-of-type(6){left:46%;height:27%;width:22%}.city:nth-of-type(7){left:71%;height:51%}.city:nth-of-type(8){left:88%;height:33%}.moon{width:49px;height:49px;border-radius:50%;background:#d6d7d2;position:absolute;right:38px;top:56px}.album-foot{position:absolute;left:35px;bottom:20px;font-size:8px;letter-spacing:3px;color:#8a91a2;z-index:3}.title-row{display:flex;justify-content:space-between;align-items:center;margin-top:24px}.title-row h1{font-size:30px;letter-spacing:-1.2px;margin:0 0 8px;font-weight:500}.artist{color:var(--muted);margin:0;font-size:14px}.transport{display:flex;gap:22px;align-items:center}.transport button{background:none;border:0;color:var(--fg);padding:10px;font-size:16px}.transport .pause{border:1px solid #727574;border-radius:50%;width:47px;height:47px;font-size:20px}.seek{height:2px;background:#454647;margin-top:28px}.seek span{display:block;width:35%;height:2px;background:#ededeb}.time{display:flex;justify-content:space-between;font:10px 'Courier New',monospace;color:var(--muted);margin-top:10px}.queue-head{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 21px}.queue-head h2{font-size:24px;font-weight:500;letter-spacing:-.8px;margin:0}.queue-head span{font-size:11px;color:var(--muted)}.request{display:flex;border-bottom:1px solid #696c6b;gap:10px;padding-bottom:12px;margin-bottom:21px}.request input{width:100%;min-width:0;border:0;background:transparent;color:var(--fg);font-size:13px;padding:7px 0}.request button{border:0;color:var(--fg);background:none;white-space:nowrap;font-size:12px;padding:7px 0 7px 14px}.request-hint{margin:-9px 0 23px;color:#898c8b;font-size:10px}.queue{margin:0;padding:0;list-style:none}.row{display:grid;grid-template-columns:20px 40px 1fr 38px;gap:14px;align-items:center;min-height:79px;border-top:1px solid var(--line)}.num{color:#696d6a;font:10px 'Courier New',monospace}.mini{width:40px;height:40px;background:#c2b9aa;color:#39322c;display:grid;place-items:center;font-family:Georgia,serif;font-size:15px}.row:nth-child(2) .mini{background:#603a31;color:#e2a585}.row:nth-child(3) .mini{background:#a7bdc0;color:#253337;font:8px 'Courier New',monospace}.row:nth-child(4) .mini{background:#d2b59a;color:#553625;font:15px Arial}.row:nth-child(5) .mini{background:#5d7275;color:#dce5d7;font:12px Arial}.track{min-width:0}.track strong{display:block;font-size:13px;line-height:1.4;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.track small{display:block;color:var(--muted);font-size:11px;margin-top:5px}.length{font:10px 'Courier New',monospace;color:#a2a5a3;text-align:right}.meta{font-size:9px;display:flex;gap:14px;color:#727873;margin-top:5px}.voice{border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding-top:20px;margin-top:17px;font-size:11px;color:var(--muted)}.voice select{color:var(--fg);background:var(--bg);border:0;padding:4px 0;font-size:11px}.green{color:#a9b5a3;margin-right:6px}footer{margin:28px 40px 0;border-top:1px solid var(--line);padding:18px 0;display:flex;justify-content:space-between;color:#737876;font:9px 'Courier New',monospace;letter-spacing:.4px}.feedback{min-height:15px;font-size:11px;color:#b8c6b0;margin:12px 0 0}@media(min-width:1450px){main{max-width:1330px;margin:38px auto}.album{height:420px;max-width:none}header,footer{max-width:1330px;margin-left:auto;margin-right:auto}.row{min-height:87px}}@media(max-width:900px){header{margin:0 24px}.account{gap:10px}main{margin:26px 24px;gap:28px}.album{height:295px}.album-title{font-size:103px}.album-label{top:144px;font-size:8px}.moon{right:20px;width:36px;height:36px}.title-row h1{font-size:25px}.transport{gap:5px}.row{gap:9px;grid-template-columns:13px 34px 1fr 33px}.mini{width:34px;height:34px}}@media(max-width:650px){header{height:67px;margin:0 20px}.brand{font-size:20px}.brand b,.account>select{display:none}.account{font-size:11px}main{display:flex;flex-direction:column;margin:24px 20px;gap:36px}.album{height:auto;aspect-ratio:1.15;max-width:none}.album-title{font-size:112px;top:35px}.album-label{top:165px}.moon{top:47px;right:31px}.title-row h1{font-size:27px}.eyebrow{font-size:9px;margin-bottom:14px}.row{min-height:77px}.track strong{font-size:12px}.voice{gap:12px}footer{margin:25px 20px;gap:20px;font-size:8px}}
</style></head><body>
<header><div class="brand">Turntable <b>/ 01</b></div><div class="account"><select aria-label="Server"><option>The listening room</option></select><span><span class="avatar">T</span>Trevor</span></div></header>
<main><section><p class="eyebrow">Now playing · YouTube</p><div class="album" aria-label="Abstract Midnight City album artwork"><div class="album-title">M83</div><div class="album-label">MIDNIGHT CITY</div><div class="city"></div><div class="city"></div><div class="city"></div><div class="city"></div><div class="city"></div><div class="city"></div><div class="moon"></div><span class="album-foot">HURRY UP, WE'RE DREAMING</span></div><div class="title-row"><div><h1 id="current-title">Midnight City</h1><p class="artist" id="current-artist">M83</p></div><div class="transport"><button class="pause" id="pause" aria-label="Pause">Ⅱ</button><button id="skip" aria-label="Next track">▸▏</button></div></div><div class="seek"><span></span></div><div class="time"><span id="elapsed">1:24</span><span id="total">4:03</span></div><div class="voice"><span><span class="green">●</span>Voice connected</span><select aria-label="Voice channel"><option>Late night lounge</option></select></div></section>
<section><div class="queue-head"><h2>Next up</h2><span id="count">5 songs · 22 min</span></div><form class="request" id="request"><input id="query" aria-label="Song request" placeholder="Song name or link" required maxlength="150"><button type="submit">Request ↗</button></form><p class="request-hint">YouTube or Spotify track links</p><ol class="queue" id="queue"></ol><p class="feedback" id="feedback" role="status"></p></section></main>
<footer><span>10 / SLEEVE</span><span>Design preview — sample queue</span></footer>
<script>
const tracks=[['Dreams','Fleetwood Mac','4:17','Mia','Spotify','FM'],['Redbone','Childish Gambino','5:26','Alex','YouTube','CG'],['Everything In Its Right Place','Radiohead','4:11','Trevor','Spotify','KID A'],['1901','Phoenix','3:13','Sam','YouTube','P'],['Teardrop','Massive Attack','5:30','Mia','YouTube','MA']];
function draw(){const list=document.getElementById('queue');list.replaceChildren();tracks.forEach((t,i)=>{const li=document.createElement('li');li.className='row';const n=document.createElement('span');n.className='num';n.textContent=String(i+1).padStart(2,'0');const cover=document.createElement('span');cover.className='mini';cover.textContent=t[5];const copy=document.createElement('div');copy.className='track';const title=document.createElement('strong');title.textContent=t[0];const artist=document.createElement('small');artist.textContent=t[1];const meta=document.createElement('div');meta.className='meta';meta.textContent=t[3]+' · '+t[4];copy.append(title,artist,meta);const len=document.createElement('span');len.className='length';len.textContent=t[2];li.append(n,cover,copy,len);list.append(li)});document.getElementById('count').textContent=tracks.length+' songs';}
document.getElementById('request').addEventListener('submit',e=>{e.preventDefault();const input=document.getElementById('query');if(!input.value.trim())return;tracks.push([input.value.trim(),'Preview request','3:30','Trevor','YouTube','TT']);input.value='';draw();document.getElementById('feedback').textContent='Added to this preview queue.'});
let paused=false;document.getElementById('pause').addEventListener('click',e=>{paused=!paused;e.currentTarget.textContent=paused?'▶':'Ⅱ';e.currentTarget.setAttribute('aria-label',paused?'Play':'Pause')});document.getElementById('skip').addEventListener('click',()=>{const t=tracks.shift();if(!t)return;document.getElementById('current-title').textContent=t[0];document.getElementById('current-artist').textContent=t[1];document.getElementById('total').textContent=t[2];document.getElementById('elapsed').textContent='0:00';draw()});draw();
</script></body></html>
